{% load static %}
{% if villains %}
<div class="navbar-custom-V d-flex justify-content-between align-items-center mb-4">
{% elif not villains %}
<div class="navbar-custom d-flex justify-content-between align-items-center mb-4">
{% endif %}
  <div class="d-flex align-items-center">
    <img src="{% static 'img/logo.png' %}" class="brand-logo" alt="LogoSuperBook">
    {% if villains %}
    <span class="brand-title-V d-none d-sm-inline">SuperBook</span>
    {% elif not villains %}
    <span class="brand-title d-none d-sm-inline">SuperBook</span>
    {% endif %}
  </div>
  {% if villains %}
  <div class="links-V">
  {% elif not villains %}
  <div class="links">
  {% endif %}
    <a href="{% url 'lista_herois' %}">Heróis</a>
    <a href="{% url 'lista_posts' %}">Posts</a>
    <a href="{% url 'lista_viloes' %}">Vilões</a>
  </div>

  {% if user.hero.imagem %}
  <img src="{{ user.hero.imagem.url }}" class="profile-pic" alt="">
  {% endif %}
</div>
